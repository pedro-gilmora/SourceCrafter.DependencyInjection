name: 'SourceCrafter.DependencyInjection: Build, Test & Deploy for .NET 9'

on:
  push:
    branches: [ "**" ]

jobs:
  try-deliver:
    name: '.NET 9 Build, Test & Deploy'
    runs-on: 'ubuntu-latest'

    steps:      
    - name: Get source code
      uses: actions/checkout@v3
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x

    - name: Restore, Package and Test
      shell: pwsh
      id: build
      run: |
        try {
          .\Package.ps1 -clean false -forcePack true -test true
        } catch {
          Write-Error @"
        Restore, Package and Test errors: 
        $($_.Exception.Message)
        "@
        }
      
    - name: Publish generator and endpoints to Nuget
      if: github.ref_name == 'dev'
      id: publish
      run: |        
        for package in $(find . -wholename '**/packaging/*.nupkg'); do
          # Execute nuget push for each package
          output=$(dotnet nuget push $package --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" | awk '/: error / { print }')

          if [ "${#output}" -ne 0 ]; then
            echo -e "Restore errors:
          $output" >> errors.log
          fi
        done

    - name: Notify Telegram
      if: always()
      shell: pwsh      
      run: |
        $status, $icon, $message = if ('${{ job.status }}' -eq 'failure') { 
          'failed', '💥', 'Errors: ${{ steps.build.outputs.errors }}`n${{ steps.publish.outputs.errors }}'.Trim()
        } elseif ('${{ job.status }}' -eq 'success') { 
          'successfully completed', '✅', '${{ github.event.head_commit.message }}' 
        } else { 
          'cancelled', '⛔', 'User aborted the action' 
        }
         
        $id = '${{ github.sha }}'.Substring(0,8)
        
        $message = @"
        🚀$icon <b>${{ github.workflow }}</b> #${{ github.run_number }} Build $status
        👤 <b>Triggered by:</b> ${{ github.actor }}
        🌿 <b>Branch:</b> ${{ github.ref }}
        🔗 <b>Change:</b> [<code>$id</code>] 
        $message
        "@

        $uri = "https://api.telegram.org/bot${{ secrets.TGBOT_TOKEN }}/sendMessage"

        $body = @{
            chat_id = ${{ secrets.SC_CHATID }}
            text    = $message
            parse_mode = 'HTML'
            message_thread_id = 4
        }

        Invoke-RestMethod -Uri $uri -Method Post -Body $body
